[package]
name = "rust-scripts"
version = "0.1.0"
edition = "2021"

[dependencies]
burn = { version = "0.18", features = [
    "train",
    "tui",
    "wgpu",
    "autodiff",
    "ndarray",
] }
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[[bin]]
name = "train"
path = "src/lib.rs"

[lib]
crate-type = ["cdylib"] # Compile this crate to a dynamic C library.

[dependencies.godot]
version = "0.2.4"
features = ["experimental-wasm", "lazy-function-tables"]
