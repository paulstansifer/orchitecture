<html>
<title>Orchitecture</title>

<head>
    <link data-trunk rel="scss" href="index.scss" />
    <link data-trunk rel="rust" data-bin="game" />
    <link data-trunk rel="copy-dir" href="assets" />
</head>

<body>
    <div id="loading-screen">
        <div class="spinner-wrap">
            <img src="assets/static/orc.png" alt="Orchitecture" />
            <svg class="spinner-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Rounded rectangle orbit path, 280x280 with r=45, centered in 300x300 -->
                    <path id="orbit"
                        d="M 55,10 L 245,10 Q 290,10 290,55 L 290,245 Q 290,290 245,290 L 55,290 Q 10,290 10,245 L 10,55 Q 10,10 55,10 Z" />
                </defs>
                <circle r="7" fill="#18b903">
                    <animateMotion dur="3s" begin="0s" repeatCount="indefinite">
                        <mpath href="#orbit" />
                    </animateMotion>
                </circle>
                <circle r="7" fill="#18b903">
                    <animateMotion dur="5s" begin="-4s" repeatCount="indefinite">
                        <mpath href="#orbit" />
                    </animateMotion>
                </circle>
                <circle r="7" fill="#18b903">
                    <animateMotion dur="7s" begin="-3s" repeatCount="indefinite">
                        <mpath href="#orbit" />
                    </animateMotion>
                </circle>
                <circle r="7" fill="#18b903">
                    <animateMotion dur="11s" begin="-2s" repeatCount="indefinite">
                        <mpath href="#orbit" />
                    </animateMotion>
                </circle>
            </svg>
        </div>
    </div>
    <script>
        function dismissLoadingScreen() {
            const screen = document.getElementById('loading-screen');
            if (!screen) return;
            screen.style.opacity = '0';
            setTimeout(() => screen.remove(), 600);
        }

        // Bevy's app.run() causes main() to exit abnormally on WASM (winit behavior),
        // so Trunk's TrunkApplicationStarted event is never dispatched. Use a
        // MutationObserver to detect when Bevy inserts its canvas as the real signal.
        const observer = new MutationObserver(() => {
            if (document.querySelector('canvas')) {
                observer.disconnect();
                dismissLoadingScreen();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        window.addEventListener('TrunkApplicationStarted', () => {
            observer.disconnect();
            dismissLoadingScreen();
        });
    </script>
</body>

</html>
