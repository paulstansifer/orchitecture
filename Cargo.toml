[package]
name = "orchitecture"
version = "0.1.0"
edition = "2021"
default-run = "game"

[dependencies]
burn = { git = "https://github.com/tracel-ai/burn", features = [
    "train",
    "wgpu",
    "autodiff",
    "ndarray",
] }
burn-import = { git = "https://github.com/tracel-ai/burn" }
clap = { version = "4.5.51", features = ["derive"] }
csv = "1.3.1"
enum-derived = "0.9.2"
gag = "1.0.0"
rand = "0.9.1"
rgb = "0.8.52"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
stdio-override = "0.2.0"
textplots = "0.8.7"
bevy = { version = "0.18.1", default-features = false, features = [
    "3d",
    "debug",
    "bevy_dev_tools",
    "default_platform",
    "bevy_gltf",
    "experimental_pbr_pcss",
] }
bevy_egui = "0.39"
# Force naga 26's stderr feature on to fix a compile bug in naga 26.0.0 (used by burn's wgpu backend)
naga = { version = "26.0.0", features = ["termcolor"] }

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "game"
path = "src/main.rs"

[lib]
name = "orchitecture_lib"

[profile.dev]
opt-level = 1 # Suggested by the Bevy docs

[profile.dev.package."*"]
opt-level = 3 # Suggested by the Bevy docs
