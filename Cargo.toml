[package]
name = "orchitecture"
version = "0.1.0"
edition = "2021"
default-run = "game"

[features]
training = [
    "burn/train",
    "burn/ndarray",
    "dep:burn-import",
    "dep:clap",
    "dep:csv",
    "dep:gag",
    "dep:stdio-override",
    "dep:textplots",
]

[dependencies]
burn = { version = "0.21.0", features = ["wgpu", "ndarray", "autodiff"] }
burn-import = { version = "0.21.0", optional = true }
clap = { version = "4.5.51", features = ["derive"], optional = true }
csv = { version = "1.3.1", optional = true }
enum-derived = "0.9.2"
gag = { version = "1.0.0", optional = true }
rand = "0.9.1"
rgb = "0.8.52"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
stdio-override = { version = "0.2.0", optional = true }
textplots = { version = "0.8.7", optional = true }
bevy = { version = "0.18.1", default-features = false, features = [
    "3d",
    "debug",
    "bevy_dev_tools",
    "default_platform",
    "bevy_gltf",
    "experimental_pbr_pcss",
] }
bevy_egui = "0.39"
# Force naga 26's stderr feature on to fix a compile bug in naga 26.0.0 (used by burn's wgpu backend)
naga = { version = "26.0.0", features = ["termcolor"] }
ron = "0.12"
assert2 = "0.4.0"
bevy_file_dialog = "0.9.1"

[[bin]]
name = "train"
path = "src/qnn/train.rs"
required-features = ["training"]

[[bin]]
name = "game"
path = "src/main.rs"

[lib]
name = "orchitecture_lib"

[profile.release]
opt-level = 2

[profile.release.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1 # Suggested by the Bevy docs
debug = 1     # Try not to run out of RAM

[profile.dev.package."*"]
opt-level = 3              # Suggested by the Bevy docs
debug = "line-tables-only"

[profile.wasm-dev]
inherits = "dev"
debug = 0

[profile.wasm-dev.package."*"]
opt-level = 2 # down from 3
debug = 0

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_0_2 = { package = "getrandom", version = "0.2", features = ["js"] }
