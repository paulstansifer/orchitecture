name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build WASM & Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Update package lists
        run: sudo apt-get update

      - name: Install OpenSCAD
        run: sudo apt-get install -y openscad

      - name: Install Assimp
        run: sudo apt-get install -y assimp-utils

      - name: Install librsvg2-bin
        run: sudo apt-get install -y librsvg2-bin

      - name: Convert SVG sprites to PNG
        run: |
          mkdir -p sprites/pngs/24x18 sprites/pngs/16x12
          for f in sprites/*.svg; do
            stem=$(basename "${f%.svg}")
            rsvg-convert -w 24 -h 18 "$f" -o "sprites/pngs/24x18/${stem}.png"
            rsvg-convert -w 16 -h 12 "$f" -o "sprites/pngs/16x12/${stem}.png"
          done

      - name: Install Dart Sass
        run: |
          npm install -g sass

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: 'latest'

      - name: Build with Trunk
        env:
          ASSET_BASE_URL: /orchitecture/
        run: trunk build --release --public-url /orchitecture/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
