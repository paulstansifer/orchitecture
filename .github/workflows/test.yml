name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Check, clippy & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Update package lists
        run: sudo apt-get update

      # Bevy's audio/input/windowing backends need these to link at all; without
      # them the build dies ~400 crates deep in alsa-sys. librsvg2-bin is what
      # build.rs shells out to for sprite generation. See DEVELOPING.md.
      - name: Install build dependencies
        run: >
          sudo apt-get install -y
          libasound2-dev libudev-dev libwayland-dev librsvg2-bin

      # Not installing openscad/assimp-utils: the generated meshes are checked
      # in, so build.rs only warns about their absence, and they cost more
      # install time than they buy here.

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --lib

      # Advisory, not a gate: the tree currently has ~26 clippy warnings, 20 of
      # them `too_many_arguments` on the simulation functions. Once the argument
      # bundling in src/TODO.md lands, drop `continue-on-error` and add
      # `-- -D warnings` to make this a real gate.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets
